<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>VIERNES | Emiliano Vargas</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}
.app{min-height:100vh;display:flex;flex-direction:column;max-width:760px;margin:auto;background:#10192a}
header{text-align:center;padding:28px 18px 22px;background:linear-gradient(180deg,#172744,#10192a);border-bottom:1px solid #293b5b}
.logo{width:72px;height:72px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;background:#315f96;font-size:32px;box-shadow:0 0 28px #315f9666}
h1{margin:0;letter-spacing:4px;font-size:30px}.creator{margin-top:7px;color:#b8c6dc;font-size:14px}
main{padding:18px;display:flex;flex-direction:column;flex:1}
#chat{flex:1;min-height:360px;overflow:auto;padding-bottom:10px}
.msg{padding:14px 16px;margin:10px 0;border-radius:17px;max-width:88%;line-height:1.4;font-size:16px}
.bot{background:#223654;border-top-left-radius:5px}.user{background:#386fa8;margin-left:auto;border-top-right-radius:5px}
.status{text-align:center;color:#aabbd3;font-size:14px;min-height:22px;margin:8px 0 14px}
.mic{width:116px;height:116px;border-radius:58px;border:0;background:#315f96;color:white;font-size:45px;display:block;margin:8px auto 16px;box-shadow:0 7px 25px #0008;touch-action:manipulation}
.mic.listening{background:#8b3f55;animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 0 16px #8b3f5522}}
.buttons{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.quick{white-space:nowrap;border:1px solid #405775;background:#1c2b44;color:white;border-radius:14px;padding:11px 13px;font-size:14px}
.info{text-align:center;color:#8496b2;font-size:12px;margin-top:4px}
</style>
</head>
<body>
<div class="app">
<header>
<div class="logo">V</div>
<h1>VIERNES</h1>
<div class="creator">Asistente virtual · Creador: Emiliano Vargas</div>
</header>
<main>
<div id="chat"></div>
<div id="status" class="status">Toca el micrófono y habla, maestra.</div>
<button id="mic" class="mic" onclick="toggleVoice()">🎙️</button>
<div class="buttons">
<button class="quick" onclick="ask('¿Cuáles son los sistemas de producción?')">Sistemas de producción</button>
<button class="quick" onclick="ask('¿Cuál es el sistema de control?')">Sistema de control</button>
<button class="quick" onclick="ask('¿Cuáles son sus elementos?')">Elementos</button>
</div>
<div class="info">Diseñada para usarse desde iPhone · Safari</div>
</main>
</div>

<script>
const chat=document.getElementById('chat'), status=document.getElementById('status'), mic=document.getElementById('mic');
let rec=null, listening=false;

function add(t,c){let d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}

function normalize(t){return t.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'')}

function answer(q){
 let s=normalize(q);
 if(s.includes('sistemas de produccion')||s.includes('sistema de produccion'))
   return 'Los principales son: por proyecto, por lotes, en masa y continua.';
 if(s.includes('sistema de control')||s.includes('control'))
   return 'Es el conjunto de métodos que supervisa y mantiene el proceso funcionando correctamente.';
 if(s.includes('elementos'))
   return 'Sus elementos son: entrada, proceso, salida, control y retroalimentación.';
 if(s.includes('hola')||s.includes('buenas'))
   return 'Hola, maestra. Soy VIERNES, asistente virtual creada por Emiliano Vargas. ¿Cuál es su pregunta?';
 return 'Puedo responder sobre sistemas de producción, sistema de control y sus elementos.';
}

function speak(t){
 if(!window.speechSynthesis){status.textContent='Respuesta mostrada en pantalla.';return}
 speechSynthesis.cancel();
 let u=new SpeechSynthesisUtterance(t);
 u.lang='es-MX';u.rate=.9;u.pitch=1;u.volume=1;
 u.onstart=()=>status.textContent='🔊 VIERNES está respondiendo...';
 u.onend=()=>status.textContent='Toca el micrófono y habla, maestra.';
 speechSynthesis.speak(u);
}

function ask(q){
 add(q,'user');
 let r=answer(q);
 setTimeout(()=>{add(r,'bot');speak(r)},250);
}

function toggleVoice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
   status.textContent='⚠️ Safari no permite reconocimiento de voz en este archivo. Usa los botones de preguntas o una versión web publicada.';
   alert('En iPhone, el reconocimiento de voz necesita una página web segura (HTTPS). Esta versión funciona con los botones y la voz de respuesta, pero para escuchar preguntas por micrófono hay que publicarla en una página HTTPS.');
   return;
 }
 if(listening){rec.stop();return}
 rec=new SR();
 rec.lang='es-MX';rec.continuous=false;rec.interimResults=false;rec.maxAlternatives=1;
 listening=true;mic.classList.add('listening');mic.textContent='⏹️';status.textContent='🎙️ Escuchando... habla ahora.';
 rec.onresult=e=>{let q=e.results[0][0].transcript;stop();ask(q)}
 rec.onerror=e=>{stop();status.textContent=e.error==='not-allowed'?'⚠️ Permite el micrófono en Safari.':'No escuché la pregunta. Inténtalo otra vez.'}
 rec.onend=()=>stop();
 try{rec.start()}catch(e){stop();status.textContent='Toca el micrófono otra vez.'}
}
function stop(){if(rec){try{rec.stop()}catch(e){}}listening=false;mic.classList.remove('listening');mic.textContent='🎙️';}

add('Hola, maestra. Soy VIERNES, asistente virtual creada por Emiliano Vargas. Puede hacerme una pregunta.','bot');
</script>
</body>
</html>
